# fuzzel.ini for trollshell — see ./README.md
#
# fuzzel is a wayland-native .desktop launcher. It reads .desktop files
# from $XDG_DATA_DIRS, so flatpak / system / user-installed apps appear
# automatically — no indexer to refresh.
#
# Per the project rule "don't change colors unprompted" the [colors]
# section below is intentionally absent: fuzzel inherits from its built-in
# defaults / the GTK theme, which sits next to the Adwaita drawer with no
# extra tuning. Layout (padding, border radius) is fair game and is set.

[main]
# Font — leave to fuzzel's default (sans-serif, scales with DPI). Uncomment
# to pin a specific face/size, fontconfig syntax:
#font=monospace:size=11

# Terminal used to launch .desktop entries with `Terminal=true`. Commented
# so the user picks; foot is a sensible default on a wayland-native stack.
#terminal=foot -e

# Single-line prompt. Quote so the trailing space survives — fuzzel trims
# unquoted trailing whitespace.
prompt="> "

# Window width in characters and max number of result rows.
width=40
lines=10

# Outer / inner padding (pixels).
horizontal-pad=20
vertical-pad=10
inner-pad=8

# Search across filename + Name + GenericName + Comment so a query like
# "browser" finds Firefox via its GenericName, and "edit" finds editors
# via their Comment. Defaults to filename,name,generic.
fields=filename,name,generic,comment

# Levenshtein fuzzy matching — typos still surface the right entry. The
# alternatives are `fzf` (substring, fuzzel's default) and `exact`.
match-mode=fuzzy

[border]
# Match the Adwaita drawer's rounded look. Layout only — not a color.
radius=12
width=2

# [colors] — intentionally omitted. Per project rule the shipped config
# does not pin colors; fuzzel falls back to its defaults / system theme.
# To override locally, add a [colors] block here with `background`,
# `text`, `match`, `selection`, `selection-text`, `border` keys (8-digit
# RRGGBBAA hex, no leading #). See fuzzel.ini(5).
