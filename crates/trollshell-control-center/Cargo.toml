[package]
name = "trollshell-control-center"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "External (out-of-shell) settings & management companion app for trollshell (#381)"

[lints]
workspace = true

[[bin]]
name = "trollshell-control-center"
path = "src/main.rs"

[dependencies]
# GTK4 + libadwaita — a normal windowed app (NOT layer-shell; never links the
# shell). Versions/features mirror hytte-ui's exactly so the workspace lock
# unifies to a single build of each — no new external crate is pulled.
adw.workspace = true
gtk = { workspace = true, features = ["v4_14"] }
# D-Bus to the running shell's `mov.vibec0re.trollshell.Control` goes through
# hytte_bus (raw zbus connections are clippy-banned); the call runs on the
# shared hytte tokio runtime (hytte-reactive).
hytte-bus = { path = "../hytte-bus" }
# The `places.toml` model + its format-preserving writer (#640). This is the
# *same* code the shell writes through — `hytte-services::places` re-exports it
# — which is the point: two editors over one file have to agree byte for byte
# on how it is validated and rendered. It is a GTK-free leaf crate precisely so
# this app can share it without linking `hytte-services` (and with it
# libpipewire and evolution-data-server).
hytte-config = { path = "../hytte-config" }
hytte-reactive = { path = "../hytte-reactive" }
# A oneshot to carry the Ping/Version reply from the tokio runtime back to the
# GTK main thread. `sync` only — no runtime features (hytte-reactive owns it).
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
# Workspace `tracing-subscriber` sets `default-features = false` (what
# hytte-services' dev-dependency needs); widen back to the full default set
# here, matching this crate's original (default-features unset) manifest.
tracing-subscriber = { workspace = true, default-features = true, features = [
  "fmt",
  "env-filter",
] }
