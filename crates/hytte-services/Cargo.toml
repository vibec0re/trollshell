[package]
name = "hytte-services"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Async clients to system daemons, exposed as hytte services"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
futures-signals = "0.3.34"
gtk = { version = "0.11.2", package = "gtk4" }
hytte-reactive = { path = "../hytte-reactive" }
niri-ipc = "25.11.0"
tokio = { version = "1.52.1", features = ["rt"] }
tracing = "0.1.44"

[dev-dependencies]
futures-executor = "0.3.32"
futures-util = "0.3.32"
tokio = { version = "1.52.1", features = ["macros", "rt", "time"] }
