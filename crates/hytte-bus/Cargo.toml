[package]
name = "hytte-bus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared D-Bus capability layer for hytte services"

[lints]
workspace = true

[features]
# Opt-in test bucket: the integration tests under tests/ that spawn a real
# dbus-daemon. Off by default so `cargo test` stays hermetic; enable with
# `--features system-tests` to run them.
system-tests = []

[dependencies]
# NOTE: no `anyhow` here — #453 removed it (declared, zero src hits).
async-stream = "0.3"
futures-signals.workspace = true
futures-util = { workspace = true, features = ["std"] }
hytte-reactive = { path = "../hytte-reactive" }
serde.workspace = true
thiserror = "2"
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true
zbus.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `test-util` is what lets `call.rs`'s retry tests run under `start_paused`:
# the loop's own sleeps walk a 250 ms → 30 s ramp, so a counting test that
# waited them out for real would cost minutes. It resolves no new package
# (tokio's `test-util = ["rt", "sync", "time"]`, all already on) and it is a
# dev-dependency, so nothing shipped carries it.
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "time",
  "process",
  "test-util",
] }
