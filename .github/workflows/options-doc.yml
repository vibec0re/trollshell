name: options doc → GitHub Pages

# Publishes the trollshell docs site (`nix build .#options-doc`): the
# autogenerated `programs.trollshell.*` options reference (#533, phase 2 —
# see #540) plus the plugin env-knob reference (#573/#614) — to GitHub
# Pages. Deliberately a leaf: it is NOT part of `nix flake check` and
# doesn't gate any other workflow. The derivation itself renders every page
# (including the root landing page); this workflow only copies files out of
# `result/` into `_site/`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let an in-flight deploy finish instead of
# racing it (mirrors GitHub's own Pages starter workflow).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Pure evaluation, no shell compile — cheap even without a binary cache.
      - run: nix build .#options-doc
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp result/share/doc/trollshell/options.html _site/options.html
          cp result/share/doc/trollshell/options.md _site/options.md
          cp result/share/doc/trollshell/plugin-env.html _site/plugin-env.html
          cp result/share/doc/trollshell/plugin-env.md _site/plugin-env.md
          # The derivation renders a small landing page linking both docs
          # (#614); the Pages root (https://<org>.github.io/trollshell/)
          # serves that now instead of a byte-copy of options.html.
          cp result/share/doc/trollshell/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
