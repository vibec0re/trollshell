[workspace]
resolver = "3"
members = [
  "crates/hytte-reactive",
  "crates/hytte-ui",
  "crates/hytte-services",
  "crates/hytte",
  "crates/hytte-bus",
  "crates/hytte-ecal",
  "crates/hytte-blur",
  "crates/hytte-plugin-proto",
  "trollshell",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://git.hannig.cc/choom/trollshell"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# `all` covers correctness, style, complexity, perf, suspicious — the
# default-warn groups. Bumping to deny locks in the 0-warning state so a
# regression breaks `cargo check`, not just clippy. Individual `allow`
# entries below still win because their priority is the default 0 while
# the umbrella settings carry priority -1.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
disallowed_methods = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
