[package]
name = "hytte-pam"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Synchronous PAM authentication for hytte-based shells"

[lints]
workspace = true

[dependencies]
pam = "0.8"
zeroize = "1.8"
thiserror = "1"

# Force-enable bindgen 0.69's `runtime` feature so its
# `ensure_libclang_is_loaded()` actually calls `clang_sys::load()`. Without
# this, once any sibling crate pulls bindgen 0.72.x (e.g. libpipewire-sys,
# libspa-sys via the audio backend), clang-sys gets `runtime` turned on at
# the workspace level — libclang is no longer statically linked — and
# pam-sys's bindgen 0.69 then trips
# "a libclang shared library is not loaded on this thread" during its
# build script. The two bindgen majors don't share features; we have to
# enable runtime on 0.69 here explicitly. The dep is otherwise unused.
[build-dependencies]
bindgen = { version = "0.69", features = ["runtime"], default-features = false }
