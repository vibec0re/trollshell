[package]
name = "hytte-services"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Async clients to system daemons, exposed as hytte services"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
nix = { version = "0.29", default-features = false, features = ["fs", "signal", "user"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
futures-channel = "0.3.32"
futures-signals = "0.3.34"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
gtk = { version = "0.11.2", package = "gtk4" }
hytte-reactive = { path = "../hytte-reactive" }
niri-ipc = "25.11.0"
tokio = { version = "1.52.1", features = ["rt", "io-util", "process"] }
tracing = "0.1.44"
zbus = { version = "5.14.0", default-features = false, features = ["tokio"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
futures-executor = "0.3.32"
futures-util = "0.3.32"
tokio = { version = "1.52.1", features = ["macros", "rt", "time"] }
