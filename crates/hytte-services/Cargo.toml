[package]
name = "hytte-services"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Async clients to system daemons, exposed as hytte services"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
nix = { version = "0.29", default-features = false, features = ["fs", "signal", "user"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
futures-channel = "0.3.32"
futures-signals = "0.3.34"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
gtk = { version = "0.11.2", package = "gtk4" }
hytte-bus = { path = "../hytte-bus" }
hytte-reactive = { path = "../hytte-reactive" }
niri-ipc = "25.11.0"
tokio = { version = "1.52.1", features = ["net", "rt", "io-util", "process", "sync", "time"] }
tracing = "0.1.44"
icalendar = { version = "0.17", default-features = false, features = ["parser", "chrono-tz"] }
# Direct zbus dep retained for zvariant::{OwnedValue, Value, ObjectPath} types
# used as data shapes (D-Bus Variants in property/signal payloads), for the
# #[zbus::interface] / #[zbus::DBusError] macros, and for zbus::fdo::Error /
# zbus::Message in interface impls. Connection and Proxy construction is
# forbidden by the workspace clippy::disallowed_methods rule.
zbus = { version = "5.14.0", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.8"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
futures-executor = "0.3.32"
futures-util = "0.3.32"
temp-env = { version = "0.3.6", features = ["async_closure"] }
tokio = { version = "1.52.1", features = ["macros", "rt", "time"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
