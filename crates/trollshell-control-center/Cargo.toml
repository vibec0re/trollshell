[package]
name = "trollshell-control-center"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "External (out-of-shell) settings & management companion app for trollshell (#381)"

[lints]
workspace = true

[features]
# Opt-in test bucket: the tests that need a real display server (GTK). Off by
# default so `cargo test` stays hermetic. Mirrors hytte-bus / hytte-reactive /
# hytte-services / hytte-ui / trollshell — this crate had no such bucket until
# #887 needed one for the Plugins tab's adaptive layout, which is geometry and
# navigation state and so cannot be asserted without a display.
#
# `nix flake check`'s `system-tests` derivation runs
# `xvfb-run -a cargo test --workspace --locked --features system-tests`, and its
# `clippy` derivation passes `--features system-tests` too, so declaring the
# feature here is all it takes for both to pick this crate's gated module up.
system-tests = []

[[bin]]
name = "trollshell-control-center"
path = "src/main.rs"

[dependencies]
# GTK4 + libadwaita — a normal windowed app (NOT layer-shell; never links the
# shell). Versions/features mirror hytte-ui's exactly so the workspace lock
# unifies to a single build of each — no new external crate is pulled.
adw.workspace = true
gtk = { workspace = true, features = ["v4_14"] }
# D-Bus to the running shell's `mov.vibec0re.trollshell.Control` goes through
# hytte_bus (raw zbus connections are clippy-banned); the call runs on the
# shared hytte tokio runtime (hytte-reactive).
hytte-bus = { path = "../hytte-bus" }
# The `places.toml` model + its format-preserving writer (#640). This is the
# *same* code the shell writes through — `hytte-services::places` re-exports it
# — which is the point: two editors over one file have to agree byte for byte
# on how it is validated and rendered. It is a GTK-free leaf crate precisely so
# this app can share it without linking `hytte-services` (and with it
# libpipewire and evolution-data-server).
hytte-config = { path = "../hytte-config" }
# The Agents tab's whole data path (#947 P4, spec §10): the `host.sock` wire
# mirror, the one-connection-per-request client, the `Status` precedence
# collapse, the `group` ordering, `agents.toml` and the companion window's
# argv + `PATH` probe. Linked as a **library**, exactly as
# `trollshell-agent-window` links it and for the same reason — three readers
# of one socket have to agree byte for byte about its verbs, and a third
# mirror would be a third thing to update when hyperhive moves. It is the
# #640 argument for `hytte-config`, applied to a wire.
#
# GTK-free, and it stays that way: it drags the plugin SDK's rlib (proto +
# hytte-preem + tokio) and **no** GUI closure, no `hytte-services` (which
# would pull libpipewire and evolution-data-server into a settings app) and no
# web engine. `checks.shell-has-no-web-engine` still holds.
hytte-plugin-agents = { path = "../hytte-plugin-agents" }
hytte-reactive = { path = "../hytte-reactive" }
# The Plugins tab's declared-mount override (#1161): `plugins.json` is read
# straight off disk (the same file `nix/hm-module.nix`/`nix/nixos-module.nix`
# render), and it's JSON rather than TOML, so this is the one leaf
# `hytte-config` doesn't already cover. Already resolved workspace-wide
# (`hytte-plugin-agents` depends on it) — this adds an edge, not a new
# `Cargo.lock` entry.
serde_json.workspace = true
# A oneshot to carry the Ping/Version reply from the tokio runtime back to the
# GTK main thread. `sync` only — no runtime features (hytte-reactive owns it).
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
# Workspace `tracing-subscriber` sets `default-features = false` (what
# hytte-services' dev-dependency needs); widen back to the full default set
# here, matching this crate's original (default-features unset) manifest.
tracing-subscriber = { workspace = true, default-features = true, features = [
  "fmt",
  "env-filter",
] }

[dev-dependencies]
# The Plugins tab's nine human mount labels are a hand-mirror of
# `Mount::wire_name`'s table, and nine string literals in a test cannot see
# the wire they mirror (#1260 review F4) — `every_wire_mount_has_a_human_label`
# iterates `Mount::ALL` instead, so a rename or a tenth variant reds here
# rather than leaking a raw wire string onto the screen.
#
# A **dev**-dependency, not a dependency: the proto rlib is already compiled
# into this binary through `hytte-plugin-agents` (see its entry above), so
# this adds no `Cargo.lock` package and no closure — but only the test names
# `Mount`, so only the test target needs the edge.
hytte-plugin-proto = { path = "../hytte-plugin-proto" }
# The Agents tab's scripted `host.sock` (#947 P4): a real `UnixListener` in a
# `TempDir` answering one recorded JSON line, the shape
# `hytte-plugin-agents/tests/fake_socket.rs` uses. Dev-only — the app itself
# reaches the socket through `hytte-plugin-agents`' client on the shared
# `hytte-reactive` runtime and needs none of these features of its own. Since
# #1260 it also backs the Plugins tab's XDG search-path tests (review F8):
# two temp dirs standing in for `$XDG_CONFIG_HOME` and an `$XDG_CONFIG_DIRS`
# entry, so those never touch the real config.
tempfile.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "time",
] }
