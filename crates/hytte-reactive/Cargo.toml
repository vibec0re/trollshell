[package]
name = "hytte-reactive"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GTK4 ↔ futures-signals bridge and service registry for hytte"

[lints]
workspace = true

[features]
# Opt-in test bucket: the tests that need a real display server (GTK).
# Off by default so `cargo test` stays hermetic.
system-tests = []

[dependencies]
futures-signals.workspace = true
gtk.workspace = true
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "sync",
  "net",
  "io-util",
  "time",
  "macros",
] }
tracing.workspace = true

[dev-dependencies]
futures-executor.workspace = true
# The shared tracing test plumbing (#1044). `supervisor`'s tests need a
# **process-global** subscriber — the callsite `Interest` cache that decides
# whether their `error!` runs at all is itself process-global — and this crate
# held the third copy of that mechanism, in the `.expect()`-inside-`call_once`
# shape #1043's review removed elsewhere (31 of 32 failures read "Once
# poisoned" instead of the cause). A dev-dependency only, and no new resolved
# package: `hytte-config` is a workspace path member with no runtime link from
# here.
hytte-config = { path = "../hytte-config", features = ["test-support"] }
# Workspace `futures-util` sets `default-features = false` (what hytte-bus/
# hytte-services' main dependency needs); widen back to the full default set
# here, matching this crate's original bare `"0.3.32"` dev-dependency.
futures-util = { workspace = true, default-features = true }
# `test-util` unlocks `tokio::time::pause()` so the `gated_poll` tests drive a
# virtual clock (deterministic, no wall-clock sleeps).
tokio = { workspace = true, features = ["test-util"] }
