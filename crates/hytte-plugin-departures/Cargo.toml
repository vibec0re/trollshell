[package]
name = "hytte-plugin-departures"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The S-Bahn departures board as an out-of-process trollshell widget plugin, visibility-gated so its poller parks while the sidebar is closed (issue #289)"

[lints]
workspace = true

[[bin]]
name = "hytte-plugin-departures"
path = "src/main.rs"

[dependencies]
# The plugin runtime SDK; re-exports the proto vocabulary and tokio_stream
# (including `wrappers::UnboundedReceiverStream`, which is un-feature-gated).
hytte-plugin = { path = "../hytte-plugin" }
# The poll task's interval + command-lane select loop and the blocking-fetch
# offload. `macros` for `select!`, `rt` for `spawn`/`spawn_blocking`.
tokio = { workspace = true, default-features = false, features = [
  "rt",
  "macros",
  "time",
  "sync",
] }
# The HAFAS/transport.rest client — the same blocking `ureq` + `spawn_blocking`
# idiom as the native `hytte-services::departures` fetcher; `rustls` for HTTPS.
ureq = { workspace = true, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
# Reads the station out of `places.toml` — the schema and the LAYERED reader
# themselves since #1227 item 2 (#1338 review, H3), not a hand-port against
# `$HOME` alone. `programs.trollshell.config.places` puts the list on the
# `XDG_CONFIG_DIRS` base layer and deliberately writes no overlay, so a loader
# that only knew `$HOME/.config` saw no station at all and told the operator to
# add a `[[place]]` the merge then refuses. Linking this crate is the
# `hytte-plugin-agents` precedent (#640's argument: a GTK-free leaf library,
# not a runtime link to the shell), and it deletes the schema port rather than
# adding to it — three readers of one file must agree about what it says.
hytte-config = { path = "../hytte-config" }
# Still here for `toml::from_str` in the endpoint-resolver tests' fixtures;
# the `[[place]]` schema itself now comes from `hytte-config`.
toml.workspace = true
# RFC 3339 departure timestamps → unix seconds + `HH:MM`. `clock` for the
# fetch-time `Utc::now()` that prunes already-departed rows.
chrono.workspace = true

[dev-dependencies]
# `$HOME`/`$XDG_CONFIG_DIRS` are what resolve the config layers, and the
# loader tests drive them against a tempdir; `temp_env` serializes that
# mutation across tests and puts it back (`std::env::set_var` is `unsafe`,
# which this workspace forbids). Both are already in `Cargo.lock` via
# `hytte-config`, so neither adds a resolved package.
tempfile.workspace = true
temp-env = "0.3.6"
