[package]
name = "trollshell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Personal Wayland desktop shell built on hytte"

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
hytte = { path = "../crates/hytte" }
hytte-pam = { path = "../crates/hytte-pam" }
nix = { version = "0.29", default-features = false, features = ["user"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
