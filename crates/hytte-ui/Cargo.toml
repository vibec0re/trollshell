[package]
name = "hytte-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GTK4 + libadwaita + layer-shell window primitives for hytte"

[lints]
workspace = true

[dependencies]
adw = { version = "0.9.1", package = "libadwaita" }
gio = { version = "0.22.5", default-features = false }
gtk = { version = "0.11.2", package = "gtk4", features = ["v4_14"] }
gtk4-layer-shell = "0.8.0"
hytte-reactive = { path = "../hytte-reactive" }
