[package]
name = "hytte-config"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GTK-free user-config layer: atomic ~/.config/trollshell writes and the places.toml model"

[lints]
workspace = true

[features]
# `subsystem::watch` — the layer poller that turns a saved edit into a live
# reload (#1044, hoisted out of the core-leds pilot). Off by default because it
# is the only part of this crate that needs an async runtime and a reactive
# handle, and `trollshell-control-center` links this crate for its Places tab
# with no runtime of its own to speak of: making tokio + futures-signals
# unconditional would grow a settings app a runtime it never drives. The shell's
# dependency line enables it; the control center's does not.
watch = ["dep:futures-signals", "dep:tokio"]
# `test_support` — the process-wide tracing global default (#1022/#1043), the
# capture harness, the scratch-overlay helper and the scratch `$HOME` (#1233). A cargo feature rather than
# `#[cfg(test)]` because `#[cfg(test)]` is per-crate: hytte-config, trollshell
# and hytte-reactive had each grown their own copy of the same `tracing`
# callsite fix, two of them weaker than the third (#1040 T5). Enabled through a
# **dev**-dependency only, so no shipped binary carries a `set_global_default`.
test-support = ["dep:tempfile", "dep:temp-env"]

[dependencies]
# `watch` only: the poll loop sleeps on tokio's timer and publishes into a
# `futures_signals::Mutable`. Neither is a new resolved package — the shell
# already links both — and neither reaches the control center, whose dependency
# on this crate leaves the feature off.
futures-signals = { workspace = true, optional = true }
serde.workspace = true
serde_ignored.workspace = true
# `test-support` only: `scratch_home`'s `$HOME`/`XDG_*` redirection (#1233).
# Same story as `tempfile` below — already this crate's dev-dependency, so the
# feature adds no resolved package, it only makes the helper reachable from a
# *dependent's* test binary. `hytte-services`' own dev-dependency asks for
# `async_closure` on top; cargo unifies the two feature sets.
temp-env = { version = "0.3.6", optional = true }
# `test-support` only: `Overlay`'s scratch directory and `scratch_home`'s
# tempdir. Already this crate's dev-dependency below, so enabling the feature
# adds no resolved package — it only makes the same crate reachable from a
# *dependent's* test binary.
tempfile = { workspace = true, optional = true }
toml.workspace = true
# The write half. See `places::render_places` for why a save patches the
# parsed document instead of re-rendering it (#640).
toml_edit.workspace = true
# `watch` only: `tokio::time::sleep` in the poll loop. `time` alone — this crate
# starts no runtime and owns no task; `hytte-reactive` does both.
tokio = { workspace = true, features = ["time"], optional = true }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `$HOME` is what resolves the config path, and the loader tests drive it
# against a tempdir; `temp_env` serializes that mutation across tests and puts
# it back (`std::env::set_var` is `unsafe`, which this workspace forbids).
temp-env = "0.3.6"
# `subsystem::watch`'s own tests (#1081): the main `tokio` dependency above is
# `features = ["time"]` only — this crate starts no runtime of its own, so
# nothing in it can actually drive an `.await`. Cargo unifies feature sets
# across dev-dependencies and the same crate's main dependency, so adding
# `rt`/`macros` here (test-only) is what lets `#[tokio::test]` build and run a
# `poll_loop`/`wait_cadence` test — and it changes nothing about what a
# consumer's non-test build links, since dev-dependencies never apply outside
# `cargo test`. `test-util` joined them for #1334: `#[tokio::test(start_paused
# = true)]` and `tokio::time::advance` both refuse to compile without it, and
# it is what let the cadence-flip test move off the wall clock onto a
# deterministic paused one.
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
