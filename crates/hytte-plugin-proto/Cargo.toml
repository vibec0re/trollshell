[package]
name = "hytte-plugin-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GTK-free wire protocol for hytte out-of-process widget plugins (frontend B, issue #35)"

[lints]
workspace = true

[features]
# Optional tokio-based framed read/write helpers (`read_frame`/`write_frame`).
# Off by default so neither the core protocol nor a plugin author is forced to
# depend on tokio — a plugin can implement the (trivial) length-prefixed framing
# against any I/O it likes, in any language.
tokio = ["dep:tokio"]

[dependencies]
serde.workspace = true
# One binary blob (MessagePack `bin`) for `Node::Pixels`'s RGBA8 buffer. A bare
# `Vec<u8>` under named-field encoding would serialize as a per-byte int array
# (~2× the bytes ≥ 0x80); `serde_bytes` pins the compact `bin` representation.
serde_bytes = "0.11"
rmp-serde = "1.3"
tokio = { workspace = true, optional = true, default-features = false, features = [
  "io-util",
] }

[dev-dependencies]
# For the forward-compat test: derive `Serialize` on a struct that carries an
# extra ("future") field, to prove an old decoder skips it.
serde.workspace = true
