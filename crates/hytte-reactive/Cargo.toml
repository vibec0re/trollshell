[package]
name = "hytte-reactive"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GTK4 ↔ futures-signals bridge and service registry for hytte"

[lints]
workspace = true

[features]
# Opt-in test bucket: the tests that need a real display server (GTK).
# Off by default so `cargo test` stays hermetic.
system-tests = []

[dependencies]
futures-signals = "0.3.34"
gtk = { version = "0.11.2", package = "gtk4" }
tokio = { version = "1.52.1", features = [
  "rt-multi-thread",
  "sync",
  "net",
  "io-util",
  "time",
  "macros",
] }
tracing = "0.1.44"

[dev-dependencies]
futures-executor = "0.3.32"
futures-util = "0.3.32"
