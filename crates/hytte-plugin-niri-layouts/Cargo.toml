[package]
name = "hytte-plugin-niri-layouts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Three one-click column layouts (equal / golden / split) for the focused niri workspace — a trollshell bar chip that is also a standalone CLI, so the same binary drives a niri spawn bind (issue #1019)"

[lints]
workspace = true

[[bin]]
name = "hytte-plugin-niri-layouts"
path = "src/main.rs"

[dependencies]
# The plugin runtime SDK. It re-exports everything else this crate needs — the
# proto vocabulary (Mount / Node / Effect::Notify / Capability::Notify),
# `tokio` (the command-lane worker's `spawn` + `spawn_blocking`) and
# `tokio_stream` (`wrappers::UnboundedReceiverStream`, behind the `sync` feature
# the SDK already enables) — so there is deliberately no direct `tokio`
# dependency here. No gtk / adw / hytte-ui: a plugin never links the shell.
hytte-plugin = { path = "../hytte-plugin" }
# The standalone hat's argv parsing (#1116, following @kaesaecracker's
# recommendation on that thread), so nix can generate shell completions from
# the same `Command` tree at build time (`nix/plugin.nix`'s hidden
# `completions <shell>` invocation) — see `cli.rs`.
clap = { workspace = true, features = ["derive"] }
clap_complete.workspace = true
# niri's own IPC types plus its blocking `socket::Socket`. This plugin dials
# `$NIRI_SOCKET` **itself** rather than routing widths through the shell:
# `Effect::Niri` only knows FocusWorkspace / FocusWindow, so the shell route
# would cost a proto bump, a capability and a host handler for something the
# shell itself never needs — and talking to niri directly is what lets the same
# binary work as a bare `spawn` bind with no shell running at all. Version-
# shared with `hytte-services`' shell-side client, which is why #1019 promoted
# it to `[workspace.dependencies]` (#453); it adds no resolved package.
niri-ipc.workspace = true
# niri's IPC is one JSON value per line, and `watch.rs` frames the `EventStream`
# handshake itself rather than through `niri_ipc::socket::Socket` — that type
# consumes itself into a closure over a private `BufReader`, leaving no way to
# arm the read timeout the watcher's shutdown path needs (#1038 review, HIGH-2).
# Also used by the tests that pin the wire bytes as literals (#1026 review,
# HIGH-1). `niri-ipc` already depends on it, so this adds no resolved package
# and no `Cargo.lock` line.
serde_json.workspace = true
