[package]
name = "hytte-sensors"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GTK-free leaf: procfs/sysfs samplers for CPU/memory/network/disk/GPU stats (#1249)"

[lints]
workspace = true

[dependencies]
# `disk::read_disk_for_specs`' only dependency: `nix::sys::statvfs::statvfs`
# for free/used/total bytes per mount point. Same version + the same "fs"
# feature `hytte-services` already resolves (its own `nix` dependency also
# needs "signal", for `recorder.rs`'s SIGINT — unrelated to sensors, so it
# stays there); pulling "fs" alone here adds no new resolved package.
nix = { version = "0.29", default-features = false, features = ["fs"] }

[dev-dependencies]
# `cpufreq.rs` and `hwmon.rs` build fixture sysfs directories to exercise the
# fast/slow-path chip resolution without touching the real `/sys`.
tempfile.workspace = true
