[package]
name = "hytte-plugin-pet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A tiny kaomoji cat for the trollshell sidebar — out-of-process plugin with an optional local-LLM brain (issue #276)"

[lints]
workspace = true

[[bin]]
name = "hytte-plugin-pet"
path = "src/main.rs"

[dependencies]
# The plugin runtime SDK; re-exports the proto vocabulary, `tokio`, and
# `tokio_stream` (with the `time`/`sync` wrappers) plus the `tick_stream`
# helper — so this plugin needs no direct tokio / tokio-stream dep of its own.
hytte-plugin = { path = "../hytte-plugin" }
# The shared OpenAI-compatible chat client (provider config, blocking HTTP,
# key-from-file). The brain runs its `chat()` on a `spawn_blocking` thread.
hytte-ai-providers = { path = "../hytte-ai-providers" }
