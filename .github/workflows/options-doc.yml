name: options doc → GitHub Pages

# Publishes the trollshell docs site (`nix build .#options-doc`): the
# autogenerated `programs.trollshell.*` options reference (#533, phase 2 —
# see #540) plus the plugin env-knob reference (#573/#614) — to GitHub
# Pages. Deliberately a leaf: it is NOT part of `nix flake check` and
# doesn't gate any other workflow. The derivation itself renders every page
# (including the root landing page); this workflow only copies files out of
# `result/` into `_site/`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time, and the NEWEST push wins: a push cancels
# whatever run holds the group instead of queueing behind it. GitHub's own
# Pages starter says `false` here ("let an in-flight deploy finish"), and
# that is what this read until #1323: on 2026-09-12 20:34Z one run (4a761915)
# stalled in the `waiting` state on the github-pages environment gate — no
# reviewer, no wait timer, branch policy allowing main, nothing pending on
# GitHub's side — and with `false` it held the group for three days while
# the 59 pushes behind it each cancelled the previous pending run and then
# waited in turn. Nothing reported it: a run cancelled by concurrency is
# not a failure. A deploy here is ~30 s (10 s `nix build`, 6 s deploy), so
# cancelling an in-flight one costs nothing — the sha that was about to
# land is superseded by the one that cancelled it — and a stalled run is
# cancelled by the next push rather than blocking every push after it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Bounded on the nix-flake-check.yml precedent (#1011): a pure `nix
    # build` of a docs derivation should be minutes, not hours, so a hang
    # gets a verdict instead of GitHub's default 360-minute limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Pure evaluation, no shell compile — cheap even without a binary cache.
      - run: nix build .#options-doc
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          # Whatever the derivation puts in share/doc/trollshell/ is what
          # gets published — a whole-directory copy so a new output file
          # never silently fails to ship (and the workflow header comment
          # above stays true without needing to be kept in sync by hand).
          # The Pages root (https://<org>.github.io/trollshell/) is the
          # derivation's own generated index.html (#614), linking the other
          # pages — not a byte-copy of options.html anymore.
          cp -R result/share/doc/trollshell/. _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
