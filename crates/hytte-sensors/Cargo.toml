[package]
name = "hytte-sensors"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GTK-free leaf: procfs/sysfs samplers for CPU/memory/network/disk/GPU stats (#1249)"

[lints]
workspace = true

[dependencies]
# Two uses, both under the "fs" feature: `disk::read_disk_for_specs`'
# `nix::sys::statvfs::statvfs` for free/used/total bytes per mount point, and
# (#1428) `desktop_entry::exec`'s `nix::unistd::access(X_OK)`, the check GIO's
# `g_find_program_for_path` makes before it lists a desktop entry (its tests
# also `mkfifo` through it). Same version + the same "fs"
# feature `hytte-services` already resolves (its own `nix` dependency also
# needs "signal", for `recorder.rs`'s SIGINT — unrelated to sensors, so it
# stays there); pulling "fs" alone here adds no new resolved package. Both
# consumers now inherit the version from `[workspace.dependencies]` (#453)
# rather than hand-repinning it.
nix.workspace = true

[dev-dependencies]
# `cpufreq.rs` and `hwmon.rs` build fixture sysfs directories to exercise the
# fast/slow-path chip resolution without touching the real `/sys`.
tempfile.workspace = true
# `tests/gtk_free.rs`'s GTK-free pin shells out to `cargo metadata` and
# parses its JSON output — already resolved in `Cargo.lock` via half the
# workspace, so this dev-only edge adds no new package.
serde_json.workspace = true
