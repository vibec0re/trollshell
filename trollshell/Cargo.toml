[package]
name = "trollshell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Personal Wayland desktop shell built on hytte"

[lints]
workspace = true

[features]
# Opt-in test bucket: the tests that need a real display server (GTK). Off by
# default so `cargo test` stays hermetic. Mirrors hytte-bus / hytte-reactive /
# hytte-services / hytte-ui (#674) — this crate had no such bucket at all
# until #674, so ~50 RefCell-across-a-GTK-call fixes (#627/#630/#631/#632/
# #638/#643) shipped with zero regression coverage.
system-tests = []

[dependencies]
# Error context for the declarative plugin launcher's fallible paths (#419) —
# the same error vocabulary hytte-services' systemd helpers already return.
anyhow.workspace = true
chrono.workspace = true
hytte = { path = "../crates/hytte" }
# Plugin host transport (#35 PR 2): the GTK-free wire protocol + its tokio
# framing helpers. GTK/adw/futures-signals still go through `hytte`'s
# re-exports; tokio + the proto crate aren't re-exported, so they're direct.
hytte-plugin-proto = { path = "../crates/hytte-plugin-proto", features = [
  "tokio",
] }
# The retro raster kit (#857), for the per-core LED panel in the Stats drawer.
# This is the *kit*, not the plugin SDK: `hytte-preem` is a GTK-free leaf whose
# only dependency is `hytte-plugin-proto`, which this crate already links —
# which is exactly why #859/#860 extracted it out of `hytte-plugin`. The shell
# rasterises into a `hytte::ui::PixelSurface` in-process; it does not, and must
# not, link the plugin client runtime to do so.
hytte-preem = { path = "../crates/hytte-preem" }
# AI-key store (#392): reads/writes API keys in the login keyring (Secret
# Service / gnome-keyring) for `secrets.rs` — the launcher injects them at
# plugin spawn, the control endpoint sets/clears them for the control-center's
# AI Keys tab. Pure-Rust + tokio-async (see the workspace dep comment).
oo7.workspace = true
# The declarative plugin launch state (#419): `plugins.json` written by the nix
# modules, deserialized by plugin_launcher.rs.
serde.workspace = true
serde_json.workspace = true
# `fs` reads plugins.json; `process` spawns `systemd-run --user` (#419); `time`
# bounds the relaunch-after-key-rotation wait-until-stopped poll (#392).
tokio = { workspace = true, features = [
  "fs",
  "net",
  "process",
  "rt",
  "sync",
  "time",
] }
# Direct zbus dep for the `#[zbus::interface]` macro backing the
# `mov.vibec0re.trollshell.Control` object (control.rs, #390). Connection
# ownership goes through `hytte_bus::own_name`, never a raw zbus connection —
# same version/features as hytte-services' dep.
zbus.workspace = true
tracing.workspace = true
# Workspace `tracing-subscriber` sets `default-features = false` (what
# hytte-services' dev-dependency needs); widen back to the full default set
# here, matching this crate's original (default-features unset) manifest.
tracing-subscriber = { workspace = true, default-features = true, features = [
  "fmt",
  "env-filter",
] }

[dev-dependencies]
# Host-side plugin-session tests (#305): `#[tokio::test]` needs `macros`, and the
# "no visibility frame arrives" assertions need `time` (`tokio::time::timeout`).
# `test-util` drives the paused-clock handshake-timeout test (#435). net/rt/sync
# are already on the normal dep; dev-dep features merge for tests.
tokio = { workspace = true, features = [
  "macros",
  "time",
  "test-util",
  "net",
  "rt",
  "sync",
] }
# The `socket_in_use` single-instancing probe test (#436) binds a real
# `UnixListener` in a scratch dir; tempfile gives it (and cleans it up).
tempfile.workspace = true
