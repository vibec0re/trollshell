[package]
name = "hytte-plugin-clock-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference out-of-process clock widget plugin for trollshell (frontend B, issue #35)"

[lints]
workspace = true

[[bin]]
name = "hytte-plugin-clock-demo"
path = "src/main.rs"

[dependencies]
# The ONLY hytte dependency: the GTK-free wire protocol. `tokio` feature pulls
# in the framed `read_frame`/`write_frame` helpers. No gtk / adw / hytte-ui /
# futures-signals — a plugin never links the shell.
hytte-plugin-proto = { path = "../hytte-plugin-proto", features = ["tokio"] }
tokio = { version = "1.52.1", default-features = false, features = [
  "rt",
  "macros",
  "net",
  "io-util",
  "time",
] }
