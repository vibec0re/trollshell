name: nix flake check

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when new commits land on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    # Bounded on purpose (#1011): three times now `nix flake check` has gone
    # silent after its last derivation finished — every check green, then
    # nothing — and the third time nobody cancelled it, so GitHub's default
    # 360-minute limit did, six hours later, leaving main without a verdict
    # for two days. The measured band for a full run was 35-52 min when this
    # was written; on 2026-09-13 it is 51-86 min (three full workspace
    # compiles — release, workspace-tests, system-tests — run concurrently on
    # the 4-core runner from the same deps closure, and the doctest tail of
    # workspace-tests now lands after the 75-minute mark on a slow VM), so
    # 120 is
    # headroom, not a squeeze.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Runs everything the flake exposes as a check: treefmt formatting, the
      # NixOS + home-manager module evals, and the package build (which runs the
      # hermetic internals test suite via doCheck). No binary cache is wired up,
      # so the first cold build of the GTK/crane closure is slow — add a Cachix
      # or FlakeHub cache step here to speed CI up if it becomes a bottleneck.
      # `timeout` (rather than only `timeout-minutes`) so a hang fails the
      # step from *inside* the job, where we can still print the process tree:
      # the open question in #1011 is whether the survivor is nix itself or a
      # VM-test child holding the log pipe, and only a listing taken during
      # the hang can answer it. 105 min leaves the job-level bound as the
      # backstop for everything else.
      - run: |
          timeout 105m nix flake check -L || rc=$?
          if [ "${rc:-0}" = 124 ]; then
            echo '::error::nix flake check did not exit within 105 min (#1011); process tree follows'
            ps auxf
            exit 1
          fi
          exit "${rc:-0}"

