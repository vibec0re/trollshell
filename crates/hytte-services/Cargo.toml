[package]
name = "hytte-services"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Async clients to system daemons, exposed as hytte services"

[lints]
workspace = true

[features]
# Opt-in test bucket: the integration tests that spawn a real dbus-daemon
# (e.g. the NM SecretAgent GetSecrets round-trip in `wifi::nm_agent`). Off by
# default so `cargo test` stays hermetic; enable with `--features system-tests`
# to run them. Mirrors hytte-bus / hytte-reactive / hytte-ui.
system-tests = []

[dependencies]
anyhow.workspace = true
nix = { version = "0.29", default-features = false, features = [
  "fs",
  "signal",
] }
chrono.workspace = true
futures-channel.workspace = true
futures-signals.workspace = true
futures-util = { workspace = true, features = ["std"] }
gtk.workspace = true
hytte-bus = { path = "../hytte-bus" }
hytte-ecal = { path = "../hytte-ecal" }
hytte-reactive = { path = "../hytte-reactive" }
niri-ipc = "26.4.0"
# Native PipeWire client. libpipewire-sys / libspa-sys discover the C
# libs via pkg-config; flake.nix supplies `pipewire` in buildInputs so
# the .pc files for libpipewire-0.3 and libspa-0.2 are on PKG_CONFIG_PATH.
# The mainloop is single-threaded + non-Send; the audio service runs it
# on a dedicated std::thread and bridges to tokio via pipewire::channel.
# NOTE: no direct `libspa` dep here — #453 removed it (declared, zero src
# hits; all SPA access goes through the `pipewire` re-export, see
# audio_native/pod.rs's doc comment).
pipewire = "0.10.0"
tokio = { workspace = true, features = [
  "net",
  "rt",
  "io-util",
  "process",
  "sync",
  "time",
  "fs",
] }
tracing.workspace = true
icalendar = { version = "0.17", default-features = false, features = [
  "parser",
  "chrono-tz",
] }
# Direct zbus dep retained for zvariant::{OwnedValue, Value, ObjectPath} types
# used as data shapes (D-Bus Variants in property/signal payloads), for the
# #[zbus::interface] / #[zbus::DBusError] macros, and for zbus::fdo::Error /
# zbus::Message in interface impls. Connection and Proxy construction is
# forbidden by the workspace clippy::disallowed_methods rule.
zbus.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# NOTE: no `zeroize` here — #453 removed it (declared, zero src hits; Wi-Fi
# secret zeroization, if wanted, is its own issue).
ureq = { workspace = true, features = ["rustls"] }
# Native `ext-idle-notify-v1` client (idle_notify.rs, #204 Phase 2). Pure-safe
# wayland-rs bindings — no `unsafe`. Versions match
# the existing transitive pins (wayland-client 0.31.x / wayland-protocols 0.32.x)
# so Cargo unifies to one build; the idle-notify staging protocol lives behind
# wayland-protocols' `staging` feature (client side).
wayland-client = "0.31.10"
wayland-protocols = { version = "0.32.13", features = ["staging", "client"] }

[dev-dependencies]
futures-executor.workspace = true
# Workspace `futures-util` sets `default-features = false` (what the main dep
# above needs); widen back to the full default set here, matching this
# crate's original bare `"0.3.32"` dev-dependency (Cargo only allows widening
# false → true on an inherited dependency, never narrowing the other way).
futures-util = { workspace = true, default-features = true }
tempfile.workspace = true
temp-env = { version = "0.3.6", features = ["async_closure"] }
# `rt-multi-thread` + `process` + `io-util` are needed by the system-tests'
# ephemeral-bus harness (BusGuard::drop calls block_in_place, which requires a
# multi-thread runtime; the daemon is spawned via tokio::process and its address
# read with io-util). They're inert for the default (hermetic) test run.
tokio = { workspace = true, features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "process",
  "io-util",
  "time",
] }
tracing-subscriber = { workspace = true, features = ["registry"] }
