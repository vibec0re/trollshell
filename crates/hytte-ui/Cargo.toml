[package]
name = "hytte-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GTK4 + libadwaita + layer-shell primitives for hytte"

[lints]
workspace = true

[features]
# Opt-in test bucket: the tests that need a real display server (GTK).
# Off by default so `cargo test` stays hermetic. Forwards into `hytte-gl`'s
# own same-named feature (PR #1299 review MED 3) so `gl_surface`'s gated
# tests can reach `hgl::dirty_unpack_state_for_test`/`dirty_pack_state_for_test`
# under `-p hytte-ui --features system-tests`, which does not otherwise turn
# on a path dependency's feature of the same name.
system-tests = ["hytte-gl/system-tests"]

[dependencies]
adw.workspace = true
futures-signals.workspace = true
gio = { version = "0.22.5", default-features = false }
gtk = { workspace = true, features = ["v4_14"] }
gtk4-layer-shell = "0.8.0"
# The workspace's OpenGL island (#893 stage B). `hytte-ui` stays `forbid(unsafe_code)`
# — every GL call the `GlSurface` widget makes goes through hytte-gl's safe
# RAII wrappers. No new resolved package: hytte-gl's own deps (`gl`,
# `libloading`) were already in `Cargo.lock`.
hytte-gl = { path = "../hytte-gl" }
hytte-reactive = { path = "../hytte-reactive" }
tracing.workspace = true
