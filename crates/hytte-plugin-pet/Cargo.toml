[package]
name = "hytte-plugin-pet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A tiny kaomoji cat for the trollshell sidebar — out-of-process plugin with an optional local-LLM brain (issue #276)"

[lints]
workspace = true

[[bin]]
name = "hytte-plugin-pet"
path = "src/main.rs"

[dependencies]
# The plugin runtime SDK; re-exports the proto vocabulary and tokio_stream.
hytte-plugin = { path = "../hytte-plugin" }
# The pet's own timer stream (`IntervalStream` sits behind the `time` feature,
# which the SDK's re-export deliberately doesn't enable).
tokio-stream = { version = "0.1", default-features = false, features = [
  "time",
] }
tokio = { version = "1.40", default-features = false, features = [
  "rt",
  "time",
  "sync",
] }
# The brain talks to a local llama-server over plain HTTP (the same blocking
# ureq + spawn_blocking idiom as hytte-services' weather fetcher).
ureq = { version = "3.3.0", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
