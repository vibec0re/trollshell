[package]
name = "trollshell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Personal Wayland desktop shell built on hytte"

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
futures-signals = "0.3.34"
gtk = { version = "0.11.2", package = "gtk4", features = ["v4_14"] }
hytte = { path = "../crates/hytte" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
