[package]
name = "hytte-plugin-caw"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "caw's desktop body — a cybercrow that renders the opencaw agent's live self-expression (mood + speech) in the trollshell sidebar"

[lints]
workspace = true

[[bin]]
name = "hytte-plugin-caw"
path = "src/main.rs"

[dependencies]
# The plugin runtime SDK; re-exports the proto vocabulary and tokio_stream
# (including `wrappers::UnboundedReceiverStream`, which is un-feature-gated).
hytte-plugin = { path = "../hytte-plugin" }
# The shared OpenAI-compatible chat client (provider config, blocking HTTP,
# key-from-file) — the morning briefing's voice (#407), same pattern as the
# pet's brain; keyless it never dials out (canned/plain composition instead).
hytte-ai-providers = { path = "../hytte-ai-providers" }
# The 2s expression-file poll loop: `rt` for `spawn` (and the briefing's
# `spawn_blocking`), `time` for `interval`, `sync` for the mpsc that feeds each
# read back into `update`.
tokio = { workspace = true, default-features = false, features = [
  "rt",
  "time",
  "sync",
] }
serde.workspace = true
serde_json.workspace = true
# The briefing's one-shot ingredient fetches (open-meteo, HAFAS) — the same
# blocking `ureq` + `spawn_blocking` idiom as the weather/departures plugins.
ureq = { workspace = true, features = ["rustls"] }
# Reads the home place (station/walk/lat/lon) out of
# `~/.config/trollshell/places.toml` — the same file + schema the native
# `places` service and the departures plugin read.
toml.workspace = true
# Local wall-clock for the briefing trigger (once a day, at a set hour) and
# RFC 3339 departure timestamps → "in N min". `clock` for `Local::now()`.
chrono = { workspace = true, features = ["clock", "std"] }
