[package]
name = "hytte-plugin-bar-clock-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference out-of-process bar-chip widget plugin for trollshell (frontend B, issue #349)"

[lints]
workspace = true

[[bin]]
name = "hytte-plugin-bar-clock-demo"
path = "src/main.rs"

[dependencies]
# The ONLY dependency: the plugin runtime SDK (#275), which re-exports the
# GTK-free wire protocol as `hytte_plugin::proto` and owns all transport
# (dial/backoff, handshake, session loop). No gtk / adw / hytte-ui /
# futures-signals — and no direct tokio — a plugin never links the shell.
hytte-plugin = { path = "../hytte-plugin" }
