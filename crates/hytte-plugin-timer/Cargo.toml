[package]
name = "hytte-plugin-timer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A pomodoro / kitchen timer for the trollshell bar — out-of-process plugin on the preem 7seg, alerting via Effect::Notify at zero (issue #406)"

[lints]
workspace = true

[[bin]]
name = "hytte-plugin-timer"
path = "src/main.rs"

[dependencies]
# The plugin runtime SDK; re-exports the proto vocabulary (incl. Effect::Notify)
# and the preem raster kit. No gtk / adw / hytte-ui — a plugin never links the
# shell.
hytte-plugin = { path = "../hytte-plugin" }
# No `tokio` / `tokio-stream` of its own (#1168): the timer's 1 Hz cadence is
# `hytte_plugin::tick_stream`, which exists precisely so a fixed-cadence plugin
# needs neither a direct async-runtime dependency nor the `time`-feature
# wrapper. (It had both, spelling the `IntervalStream` incantation by hand
# under a comment claiming the SDK's `tokio_stream` re-export does not enable
# `time` — it does.)
